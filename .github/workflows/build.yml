name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Dar permiso de ejecución a gradlew
        run: chmod +x ./gradlew

      - name: Compilar APK de depuración
        run: ./gradlew assembleDebug --no-daemon

      - name: Verificar que el APK es válido y está firmado
        run: |
          set -e
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -la "$APK"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "Usando build-tools: $BUILD_TOOLS"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | head -5
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          unzip -l "$APK" | tail -5

      - name: Subir APK como resultado
        uses: actions/upload-artifact@v4
        with:
          name: wii-backup-manager-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Renombrar APK con la fecha
        run: cp app/build/outputs/apk/debug/app-debug.apk wii-backup-manager.apk

      - name: Publicar como Release descargable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Último APK compilado
          body: APK de depuración, generado automáticamente desde el último cambio en main. Descarga wii-backup-manager.apk y ábrelo para instalar.
          files: wii-backup-manager.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
