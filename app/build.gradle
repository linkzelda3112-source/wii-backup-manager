plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wbm'
    compileSdk 35

    defaultConfig {
        applicationId "com.wbm.wiibackupmanager"
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName "0.0.9"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Descompresión de archivos RVZ (Dolphin usa Zstandard por defecto; LZMA/LZMA2/bzip2 son
    // alternativas más raras que también admite el formato).
    //
    // Para Zstandard se usa aircompressor (implementación en Java puro, sin JNI/librería nativa)
    // y NO zstd-jni: zstd-jni solo empaqueta bibliotecas nativas para Linux/macOS/Windows de
    // escritorio (glibc), no para Android (bionic), así que al llamarla en un teléfono lanza
    // java.lang.UnsatisfiedLinkError — un Error, no una Exception, que no queda atrapado por los
    // try/catch de la app y cierra la aplicación entera (justo el "se cierra la app al convertir
    // RVZ" reportado por un usuario real; antes nunca se llegaba a esta llamada porque fallaba
    // antes, al leer mal las tablas del archivo).
    implementation 'io.airlift:aircompressor:2.0.2'
    implementation 'org.tukaani:xz:1.9'
    implementation 'org.apache.commons:commons-compress:1.26.2'

    // Carátulas (GameTDB) con caché en disco y en memoria.
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    testImplementation 'junit:junit:4.13.2'
}
