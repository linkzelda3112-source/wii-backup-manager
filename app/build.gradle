plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wbm'
    compileSdk 35

    defaultConfig {
        applicationId "com.wbm.wiibackupmanager"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Descompresión de archivos RVZ (Dolphin usa Zstandard por defecto; LZMA/LZMA2/bzip2 son
    // alternativas más raras que también admite el formato).
    implementation 'com.github.luben:zstd-jni:1.5.6-6'
    implementation 'org.tukaani:xz:1.9'
    implementation 'org.apache.commons:commons-compress:1.26.2'

    // Carátulas (GameTDB) con caché en disco y en memoria.
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    testImplementation 'junit:junit:4.13.2'
}
